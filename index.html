<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gonçalo Reis</title>
  <meta name="description" content="I build with frontier AI and invest early in founders.">
  <link rel="canonical" href="https://reisierx.com/">
  <style>
    :root {
      --paper: #F7F5F0;
      --ink: #141414;
      --cobalt: #1F3FA8;
      --graphite: #5C5B57;
      --rule: #DCD8CE;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
      font-size: 1.25rem;
      line-height: 1.45;
    }
    main {
      max-width: 36em;
      margin: 0 auto;
      padding: 22vh 1.5rem 4rem;
    }
    @media (max-width: 40em) {
      main { padding-top: 16vh; }
      body { font-size: 1.125rem; }
    }
    h1 {
      margin: 0 0 1.15rem;
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    p { margin: 0 0 1rem; }
    nav {
      margin: 2rem 0 0;
      font-size: 1.125rem;
    }
    nav a {
      color: var(--cobalt);
      text-decoration: underline;
      text-underline-offset: 0.18em;
    }
    nav a:hover { text-decoration-thickness: 0.12em; }
    nav a:focus-visible {
      outline: 2px solid var(--cobalt);
      outline-offset: 3px;
    }
    .sep {
      color: var(--graphite);
      margin: 0 0.55rem;
      user-select: none;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
      color: var(--graphite);
      font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.875rem;
      letter-spacing: 0.01em;
    }
    footer p { margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Gonçalo Reis</h1>
    <p>I build with frontier AI and invest early in founders.</p>
    <p>This site is built in public, one change at a time. Each change goes live here.</p>
    <nav aria-label="Profiles and change log">
      <a href="https://github.com/goncaloreis">GitHub</a><span class="sep" aria-hidden="true">·</span><a href="https://x.com/GoncaloReis">X</a><span class="sep" aria-hidden="true">·</span><a href="https://github.com/goncaloreis/home/commits/main">Log</a>
    </nav>
    <footer>
      <p>Last change 25 Nov 2026</p>
    </footer>
  </main>
</body>
</html>
