name: claude

# Consulting Claude (CLAUDE.md): Claude writes specs + evals on issues and reviews PRs against them; Tech builds.
# Standard setup from github.com/anthropics/claude-code-action (examples/claude.yml), with the changes commented below.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened]

jobs:
  claude:
    # Non-standard: the token is the owner's personal Claude subscription, so only trusted repo owners/members/
    # collaborators (or goncaloreis) can spend it, on top of the action's own write-access check.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
      ) || (github.actor == 'goncaloreis' && (
        contains(github.event.comment.body, '@claude') || contains(github.event.review.body, '@claude') ||
        contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude') ||
        contains(github.event.pull_request.body, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Non-standard: one Claude run per issue/PR at a time (a personal subscription has a usage window).
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read # Non-standard (example has write): Claude specs and reviews; it never pushes code (builder/reviewer split).
      pull-requests: write
      issues: write
      id-token: write # the Claude GitHub App token exchange (OIDC)
      actions: read # CI status
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275 (pinned by SHA)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Owner's choice: the strongest Opus at the highest effort (docs: code.claude.com/docs/en/model-config).
          # Web research is part of Claude's role (CLAUDE.md); the action does not pre-approve them.
          claude_args: |
            --model claude-opus-5-5
            --effort max
            --allowedTools "WebSearch,WebFetch"

      # Non-standard: record what actually ran (model, turns, duration) from the execution file, without the
      # conversation itself (show_full_output stays off).
      - name: What ran
        if: always() && steps.claude.outputs.execution_file != ''
        continue-on-error: true
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -c '[.[] | select(.type == "system" and .subtype == "init")][0] | {model, claude_code_version, permissionMode, effort: (.effort // .effortLevel // null), web_tools_present: [(.tools // [])[] | select(. == "WebSearch" or . == "WebFetch")]}' "$EXEC" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '{web_tool_calls: ([.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | .name | select(. == "WebSearch" or . == "WebFetch")] | group_by(.) | map({(.[0]): length}) | add // {})}' "$EXEC" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '[.[] | select(.type == "result")][-1] | {web_tool_denials: ([.permission_denials[]? | .tool_name | select(. == "WebSearch" or . == "WebFetch")] | group_by(.) | map({(.[0]): length}) | add // {})}' "$EXEC" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -c '[.[] | select(.type == "result")][-1] | {subtype, is_error, num_turns, duration_ms, duration_api_ms, total_cost_usd, modelUsage}' "$EXEC" | tee -a "$GITHUB_STEP_SUMMARY"
